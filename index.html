<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terminal.exe</title>
<style>
:root { color-scheme: dark; --green:#70ff9a; --dark:#050905; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#030603; font-family:Consolas,"Courier New",monospace; color:var(--green); }
body { min-height:100dvh; display:grid; place-items:center; padding:10px; }
.terminal { width:min(950px,100%); min-height:min(670px,96dvh); border:1px solid #285437; background:#050a06; box-shadow:0 0 40px #00ff2211; overflow:hidden; }
.bar { height:30px; border-bottom:1px solid #285437; text-align:center; line-height:29px; font-size:11px; color:#74967b; }
.screen { display:flex; flex-direction:column; align-items:center; padding:24px 20px 16px; }
.command { align-self:flex-start; font-size:14px; min-height:20px; white-space:pre; }
.command.typing::after { content:"_"; animation:blink .7s steps(1) infinite; }
.stage { position:relative; width:100%; height:clamp(360px,65dvh,550px); display:grid; place-items:center; overflow:hidden; }
.grandma { display:block; width:auto; max-width:100%; height:100%; object-fit:contain; opacity:0; transform:translateY(70px) scale(.92); filter:drop-shadow(0 0 12px #28ff5e33); user-select:none; -webkit-user-drag:none; }
.grandma.show { animation:enter .9s cubic-bezier(.2,.7,.2,1) both, float 3s ease-in-out 1s infinite; }
.scanlines { pointer-events:none; position:absolute; inset:0; opacity:.17; background:repeating-linear-gradient(to bottom,transparent 0px,transparent 4px,#000 5px,#000 6px); }
button { font:inherit; font-size:13px; color:var(--green); padding:9px 20px; border:1px solid #356b43; background:#07150c; cursor:pointer; }
button:hover { background:#103019; }
button[hidden] { display:none; }
@keyframes enter { from { opacity:0; transform:translateY(70px) scale(.92); filter:blur(9px) drop-shadow(0 0 4px #28ff5e30); } to { opacity:1; transform:translateY(0) scale(1); filter:blur(0) drop-shadow(0 0 12px #28ff5e33); } }
@keyframes float { 0%,100% { transform:translateY(0) rotate(-.6deg); } 50% { transform:translateY(-7px) rotate(.6deg); } }
@keyframes blink { 50% { opacity:0; } }
@media(max-width:600px) { body{padding:4px;} .screen{padding:18px 10px;} .stage{height:clamp(400px,70dvh,610px);} .command{font-size:12px;} }
@media(prefers-reduced-motion:reduce) { .grandma.show{animation:none;opacity:1;transform:none;} }
</style>
</head>

    <button id="repeat" type="button" hidden>Repetir</button>

</main>
<script>
const command=document.getElementById('command');
const grandma=document.getElementById('grandma');
const repeat=document.getElementById('repeat');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let sequence=0;
async function play(){
 const run=++sequence;
 grandma.classList.remove('show');
 void grandma.offsetWidth;
 repeat.hidden=true;
 command.textContent='';
 command.classList.add('typing');
 for(const ch of 'C:\\> execute.exe') {
   if(run!==sequence) return;
   command.textContent+=ch;
   await sleep(48);
 }
 if(run!==sequence)return;
 command.classList.remove('typing');
 await sleep(260);
 if(run!==sequence)return;
 grandma.classList.add('show');
 await sleep(1200);
 if(run!==sequence)return;
 repeat.hidden=false;
}
repeat.addEventListener('click',play);
play();
</script>
